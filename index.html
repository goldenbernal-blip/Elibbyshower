<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c9e1f6" />
  <meta name="description" content="Elian is on the way, and we'd love for you to be part of it." />
  <title>Elian Is on the Way</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet" />
  <style>
    :root{font-family:"Nunito Sans",sans-serif;color:#52677b;background:#c9e1f6}*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-width:320px;height:100%;overflow:hidden}button,a{font:inherit}button{-webkit-tap-highlight-color:transparent}.experience{position:relative;height:100svh;overflow:hidden;isolation:isolate;background:linear-gradient(155deg,#f7fbfe 0%,#d9eafa 32%,#bbd9f3 100%)}.paper{position:fixed;inset:0;z-index:-2;opacity:.2;background-image:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 63%,#7faed9 0 1px,transparent 2px);background-size:37px 41px,53px 47px;mix-blend-mode:soft-light}.sky{position:fixed;inset:0;z-index:-1;pointer-events:none}.cloud{position:absolute;width:190px;height:56px;border-radius:999px;background:rgba(255,255,255,.75);filter:drop-shadow(0 16px 18px rgba(107,148,182,.12));animation:drift 13s ease-in-out infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit;bottom:11px}.cloud:before{width:76px;height:76px;left:29px}.cloud:after{width:98px;height:98px;right:22px}.c1{left:-65px;top:18%}.c2{right:-55px;top:12%;transform:scale(.7);animation-delay:-4s}.c3{left:12%;bottom:-10px;transform:scale(1.25);animation-delay:-7s}.c4{right:10%;bottom:17%;transform:scale(.65);opacity:.62}.star{position:absolute;color:rgba(255,255,255,.86);font-style:normal;animation:twinkle 3.2s ease-in-out infinite}.s1{left:10%;top:9%;font-size:25px}.s2{right:14%;top:31%;font-size:21px}.s3{left:18%;bottom:22%;font-size:17px}.s4{right:7%;bottom:8%;font-size:29px;color:#f4ce72}
    .welcome,.list{position:absolute;inset:0;height:100svh}.welcome{display:grid;grid-template-columns:minmax(610px,1.25fr) minmax(390px,.75fr);align-items:center;gap:clamp(10px,2.5vw,42px);padding:clamp(28px,4vw,64px);transition:opacity .65s ease,transform 1s cubic-bezier(.2,.8,.2,1),visibility .65s}.hero{position:relative;height:min(86svh,780px);width:100%;animation:arrive .9s ease both}.flight{position:absolute;left:8%;top:50%;width:min(36vw,440px);aspect-ratio:768/1082;transform:translateY(-50%);overflow:hidden;border-radius:45% 45% 16px 16px;box-shadow:0 30px 70px rgba(74,119,158,.18);-webkit-mask-image:radial-gradient(ellipse 70% 74% at 50% 48%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 70% 74% at 50% 48%,#000 70%,transparent 100%)}.flight video{width:100%;height:100%;object-fit:cover;display:block}.portrait{position:absolute;right:-12%;top:52%;width:min(34vw,445px);aspect-ratio:614/843;transform:translateY(-50%);opacity:.24;mix-blend-mode:multiply;filter:grayscale(.16) saturate(.55) hue-rotate(8deg);animation:breathe 7s ease-in-out infinite}.portrait img{width:100%;height:100%;display:block;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 61% 68% at 51% 48%,#000 52%,rgba(0,0,0,.5) 72%,transparent 100%);mask-image:radial-gradient(ellipse 61% 68% at 51% 48%,#000 52%,rgba(0,0,0,.5) 72%,transparent 100%)}.copy{position:relative;z-index:2;max-width:650px;animation:copyIn .7s ease .18s both}.copy h1{margin:0;color:#4e6579;font-family:"Cormorant Garamond",serif;font-weight:500;line-height:1}.copy h1 strong{display:block;color:#79a9da;font-size:clamp(5.5rem,10vw,10rem);font-weight:500;line-height:.72;text-shadow:0 12px 24px rgba(78,124,167,.14)}.copy h1 span{display:block;margin-top:26px;font-family:"Nunito Sans",sans-serif;font-size:clamp(1.25rem,2.2vw,1.85rem);line-height:1.48}.primary,.view{border:0;border-radius:4px;background:#729fcf;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 13px 24px rgba(77,123,167,.22)}.primary{margin-top:34px;padding:15px 21px;display:inline-flex;align-items:center;gap:12px}.primary:hover,.view:hover{background:#5f8fbe}button:focus-visible,a:focus-visible{outline:3px solid #f4c85e;outline-offset:3px}
    .open .welcome{opacity:0;transform:translateY(-45%) scale(.86);visibility:hidden}.list{display:grid;grid-template-rows:auto 1fr auto auto auto;padding:clamp(22px,3vw,42px) clamp(20px,5vw,72px) 24px;opacity:0;visibility:hidden;transition:opacity .65s ease .35s,visibility .65s}.open .list{opacity:1;visibility:visible}.list header{display:grid;grid-template-columns:44px 1fr 54px;align-items:center;text-align:center;position:relative;z-index:10}.list header span{display:block;color:#788fa3;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.list h2{margin:-4px 0 0;color:#76a7d8;font-family:"Cormorant Garamond",serif;font-size:clamp(2.5rem,4vw,3.5rem);font-weight:500;line-height:1}.counter{margin:0;font-size:.76rem;font-weight:800;color:#7990a5}.round{width:42px;height:42px;border:1px solid rgba(111,156,197,.24);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.58);color:#6b8dad;cursor:pointer}.carousel{position:relative;width:100%;height:100%;min-height:420px;touch-action:pan-y;user-select:none}.product{position:absolute;left:50%;top:50%;width:min(36vw,390px);border:0;padding:0;background:transparent;color:#51677a;cursor:pointer;transform:translate(calc(-50% + var(--offset)*37vw),-50%) scale(var(--scale));opacity:var(--opacity);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s;pointer-events:none}.product.current,.product.near{pointer-events:auto}.product:not(.current) strong{opacity:.45}.product-cloud{width:100%;aspect-ratio:1.25;display:grid;place-items:center;position:relative}.product-cloud:before{content:"";position:absolute;width:78%;height:48%;left:11%;bottom:9%;border-radius:50%;background:rgba(255,255,255,.68);filter:blur(1px) drop-shadow(0 22px 24px rgba(91,134,172,.15));box-shadow:-52px 10px 0 -12px rgba(255,255,255,.6),52px 12px 0 -13px rgba(255,255,255,.62),0 -29px 0 -15px rgba(255,255,255,.68)}.product img{position:relative;width:72%;height:82%;object-fit:contain;filter:drop-shadow(0 18px 17px rgba(67,103,133,.18))}.product strong{display:block;min-height:2.5em;margin:3px auto 0;max-width:330px;font-family:"Cormorant Garamond",serif;font-size:clamp(1.65rem,3vw,2.4rem);font-weight:600;line-height:1.05}.controls{display:flex;align-items:center;justify-content:center;gap:24px}.dots{display:flex;gap:6px;align-items:center}.dots i{width:5px;height:5px;border-radius:50%;background:#a8bed1;transition:.3s}.dots i.active{width:19px;border-radius:8px;background:#719fcf}.view{justify-self:center;margin-top:15px;padding:13px 20px}.hint{text-align:center;font-size:.68rem;margin:9px 0 0;color:#8195a7}
    .thank{grid-row:2/6;align-self:center;justify-self:center;width:min(560px,90vw);text-align:center;animation:copyIn .7s ease both}.thank .sparkle{display:block;color:#efc96f;font-size:2rem;animation:twinkle 3s ease-in-out infinite}.thank .eyebrow{margin:8px 0 5px;color:#bc9558;font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.thank h3{margin:0;color:#76a7d8;font-family:"Cormorant Garamond",serif;font-size:clamp(3.2rem,7vw,6.5rem);line-height:.86;font-weight:500}.thank .note{max-width:470px;margin:24px auto 5px;color:#596e80;font-size:1.05rem;line-height:1.65}.thank .view{margin-top:22px}.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(86,117,145,.26);backdrop-filter:blur(12px)}.modal{position:relative;width:min(440px,100%);padding:24px 25px 27px;text-align:center;border:1px solid rgba(255,255,255,.82);border-radius:8px;background:rgba(250,253,255,.95);box-shadow:0 28px 80px rgba(68,98,125,.25)}.close{position:absolute;right:16px;top:16px}.modal img{width:150px;height:150px;object-fit:contain}.modal .eyebrow{margin:4px 0;color:#c09c61;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.modal h3{margin:5px auto 20px;max-width:340px;color:#6f9dcc;font-family:"Cormorant Garamond",serif;font-size:2rem;line-height:1}.links{display:grid;gap:10px}.links a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 15px;border-radius:4px;background:#eaf3fb;color:#526b83;text-decoration:none;font-weight:800}
    @keyframes arrive{from{opacity:0;transform:translateY(-50px)}to{opacity:1}}@keyframes copyIn{from{opacity:0;transform:translateY(18px)}to{opacity:1}}@keyframes breathe{50%{transform:translateY(calc(-50% - 7px))}}@keyframes drift{50%{margin-left:27px}}@keyframes twinkle{50%{opacity:.32;transform:scale(.75)}}
    @media(max-width:760px){.welcome{display:flex;flex-direction:column;justify-content:center;padding:10px 18px 22px;text-align:center}.hero{height:min(56svh,500px);flex:none;margin-top:-2svh}.flight{left:8%;top:48%;width:min(68vw,315px);border-radius:44%}.portrait{right:-18%;top:54%;width:min(65vw,300px);opacity:.2}.copy{margin-top:-2svh}.copy h1 strong{font-size:clamp(4.9rem,24vw,6.7rem)}.copy h1 span{font-size:.98rem;line-height:1.42;margin-top:16px}.primary{margin-top:18px;padding:14px 18px}.cloud{transform:scale(.55)}.c2{right:-90px}.c3{left:-50px;bottom:-25px}.c4{display:none}.list{padding:16px 14px max(15px,env(safe-area-inset-bottom))}.list header{grid-template-columns:42px 1fr 54px}.list h2{font-size:2.6rem}.carousel{min-height:0}.product{width:min(76vw,350px);transform:translate(calc(-50% + var(--offset)*78vw),-50%) scale(var(--scale))}.product-cloud{aspect-ratio:1.05}.product img{width:77%;height:84%}.product strong{font-size:1.6rem;min-height:2.1em}.controls{gap:18px}.modal{padding:21px 19px 23px}.modal img{width:132px;height:132px}.modal h3{font-size:1.75rem;padding:0 18px}}
    @media(max-width:380px),(max-height:690px){.hero{height:47svh}.flight{width:min(53vw,230px)}.portrait{width:min(63vw,270px)}.copy h1 strong{font-size:4.55rem}.copy h1 span{font-size:.86rem;margin-top:12px}.primary{margin-top:13px;padding:12px 16px}.list{padding-top:10px}.list h2{font-size:2.2rem}.product strong{font-size:1.38rem}.view{margin-top:9px;padding:11px 16px}.hint{margin-top:6px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="experience" id="experience">
    <div class="paper"></div>
    <div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i><i class="star s1">★</i><i class="star s2">✦</i><i class="star s3">★</i><i class="star s4">✦</i></div>
    <section class="welcome" aria-label="Welcome">
      <div class="hero">
        <div class="flight" aria-hidden="true"><video autoplay muted loop playsinline preload="metadata"><source src="elian-balloon.mp4" type="video/mp4" /></video></div>
        <div class="portrait"><img src="baby-boy-portrait.png" alt="Storybook portrait of a baby boy kneeling with his hands clasped" /></div>
      </div>
      <div class="copy"><h1><strong>Elian</strong><span>is on the way, and we'd love for you to be part of it.</span></h1><button class="primary" id="openList">Open Elians list <span aria-hidden="true">→</span></button></div>
    </section>
    <section class="list" aria-label="Elian's list">
      <header><button class="round" id="home" aria-label="Return to welcome">←</button><div><span>A little something for</span><h2>Elian</h2></div><p class="counter" id="counter">1 / 9</p></header>
      <div class="carousel" id="carousel"></div>
      <div class="controls" id="controls"><button class="round" id="previous" aria-label="Previous item">←</button><div class="dots" id="dots"></div><button class="round" id="next" aria-label="Next item">→</button></div>
      <button class="view" id="view">View purchase options</button><p class="hint" id="hint">Swipe to see the next item</p>
      <div class="thank" id="thank" hidden><span class="sparkle">✦</span><p class="eyebrow">Thank you</p><h3>For helping us welcome Elian.</h3><p class="note">Your love and thoughtfulness mean so much to our growing family.</p><button class="view" id="again">View the list again</button></div>
    </section>
  </main>
  <div class="modal-wrap" id="modal" hidden><article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="round close" id="close" aria-label="Close">×</button><img id="modalImage" alt="" /><p class="eyebrow">For Elian</p><h3 id="modalTitle"></h3><div class="links" id="links"></div></article></div>
  <script>
    const items=[
      {name:"Baby shampoo / soap",image:"baby-wash.png",options:[["Mustela at edamama","https://www.edamama.ph/shop/product/gentle-cleansing-gel-500ml-1598518445936"],["Aveeno at Watsons","https://www.watsons.com.ph/aveeno-aveeno-baby-daily-wash-shampoo-236ml-newborn-for-sensitive-baby-skin-baby-care-baby-bath/p/BP_50014254"]]},
      {name:"Baby oil",image:"baby-oil.png",options:[["50ml at Watsons","https://www.watsons.com.ph/johnsons-baby-johnson-s-baby-oil-50ml-newborn-baby-essentials-baby-care-baby-massage-oil-baby-oil-for-newborn/p/BP_10015541"],["125ml at Watsons","https://www.watsons.com.ph/johnsons-baby-johnson-s-baby-oil-125ml-newborn-baby-essentials-baby-care-baby-massage-oil-baby-oil-for-newborn/p/BP_10003069"]]},
      {name:"Baby detergent soap",image:"baby-detergent.png",options:[["Tiny Buds at edamama","https://www.edamama.ph/shop/product/tiny-buds-natural-laundry-powder-for-babies-1kg-1585030026872"],["Smart Steps at Watsons","https://www.watsons.com.ph/smart-steps-smart-steps-baby-laundry-detergent-liquid-900ml/p/BP_50016983"]]},
      {name:"Philips AVENT 4oz bottle",image:"bottle.png",options:[["View at edamama","https://www.edamama.ph/shop/product/avent-natural-response-baby-bottle-4oz-1733393405101"],["View at Lazada","https://www.lazada.com.ph/products/pdp-i5220778915.html"]]},
      {name:"Dry cotton wipes",image:"dry-wipes.png",options:[["Tiny Buds at edamama","https://www.edamama.ph/shop/product/tiny-buds-newborn-dry-cotton-wipes-50-pulls-1639058634013"],["Baby Moby at Rustan's","https://rustans.com/products/baby-moby-dry-wipes"]]},
      {name:"Large cotton balls",image:"cotton-balls.png",options:[["Baby Moby at Rustan's","https://rustans.com/products/baby-moby-cotton-balls-large-80-grams"],["Sanicare at Lazada","https://www.lazada.com.ph/products/pdp-i4714544102.html"]]},
      {name:"Mustela Vitamin Barrier Cream 123",image:"barrier-cream.png",options:[["View at edamama","https://www.edamama.ph/shop/product/vitamin-barrier-cream-123-50ml-1598520696653"],["View at Lazada","https://www.lazada.com.ph/products/pdp-i103251566.html"]]},
      {name:"Mustela Cicastela Recovery Cream",image:"cicastela.png",options:[["View at edamama","https://www.edamama.ph/shop/product/mustela-cicastela-moisture-recovery-cream-with-free-sun-lotion-1744620530167"],["View at Lazada","https://www.lazada.com.ph/products/pdp-i517432542.html"]]},
      {name:"Tiny Buds After Shots",image:"after-shots.png",options:[["Single at edamama","https://www.edamama.ph/shop/product/tiny-buds-after-shots-baby-vaccinations-gel-15g-1718355211936"],["Bundle at edamama","https://www.edamama.ph/shop/product/after-shots-baby-vaccinations-gel-15g-bundle-of-2-1711442270171?utm_source=chatgpt.com"]]}
    ];
    const $=id=>document.getElementById(id);let active=0,startX=null,finished=false;
    function render(){
      $("carousel").innerHTML=items.map((item,index)=>{let d=(index-active+items.length)%items.length,s=d>items.length/2?d-items.length:d,scale=Math.max(.64,1-Math.min(Math.abs(s),2)*.18),opacity=Math.max(.3,1-Math.min(Math.abs(s),2)*.35);return `<button class="product ${s===0?'current':''} ${Math.abs(s)===1?'near':''}" style="--offset:${s};--scale:${scale};--opacity:${opacity}" data-index="${index}" aria-label="${item.name}${s===0?', open purchase options':''}"><span class="product-cloud"><img src="${item.image}" alt=""></span><strong>${item.name}</strong></button>`}).join("");
      $("dots").innerHTML=items.map((_,i)=>`<i class="${i===active?'active':''}"></i>`).join("");$("counter").textContent=`${active+1} / ${items.length}`;$("next").setAttribute("aria-label",active===items.length-1?"Continue to thank you":"Next item");$("hint").textContent=active===items.length-1?"Swipe once more for a little note":"Swipe to see the next item";
      document.querySelectorAll(".product").forEach(button=>button.addEventListener("click",()=>{let i=Number(button.dataset.index);if(i===active)openModal(i);else{active=i;render()}}));
    }
    function move(step){if(step>0&&active===items.length-1){showThanks();return}active=(active+step+items.length)%items.length;render()}
    function showThanks(){finished=true;$("carousel").hidden=$("controls").hidden=$("view").hidden=$("hint").hidden=true;$("thank").hidden=false;$("counter").textContent="Thank you"}
    function openModal(i){let item=items[i];$("modalImage").src=item.image;$("modalTitle").textContent=item.name;$("links").innerHTML=item.options.map(([label,url])=>`<a href="${url}" target="_blank" rel="noreferrer">${label}<span aria-hidden="true">↗</span></a>`).join("");$("modal").hidden=false}
    $("openList").onclick=()=>$("experience").classList.add("open");$("home").onclick=()=>{$("experience").classList.remove("open");finished=false};$("previous").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("view").onclick=()=>openModal(active);$("close").onclick=()=>$("modal").hidden=true;$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").hidden=true};$("again").onclick=()=>{active=0;finished=false;$("carousel").hidden=$("controls").hidden=$("view").hidden=$("hint").hidden=false;$("thank").hidden=true;render()};$("carousel").onpointerdown=e=>startX=e.clientX;$("carousel").onpointerup=e=>{if(startX!==null&&Math.abs(e.clientX-startX)>42)move(e.clientX<startX?1:-1);startX=null};render();
  </script>
</body>
</html>
